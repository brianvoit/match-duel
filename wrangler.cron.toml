name = "match-duel-cron"
main = "src/cron.ts"
compatibility_date = "2026-05-22"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[triggers]
crons = ["* * * * *"]

[vars]
SUPABASE_FUNCTIONS_URL = "https://fqievqqzxrgvqrgknvas.supabase.co/functions/v1"
APP_URL = "https://match-duel.com"

# Secrets — set each with:
#   wrangler secret put <NAME> --config wrangler.cron.toml
#
# Required:
#   SUPABASE_SERVICE_ROLE_KEY   (Supabase service role key)
#   JOB_ADMIN_TOKEN             (must match JOB_ADMIN_TOKEN in Cloudflare Pages/Workers env)
