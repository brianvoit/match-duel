name = "match-duel"
main = "cloudflare/worker-entry.ts"
compatibility_date = "2026-05-22"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

# Smart Placement routes all traffic to the fewest edge nodes closest to Supabase,
# dramatically reducing cold starts vs the default global distribution.
[placement]
mode = "smart"

[[routes]]
pattern = "match-duel.com"
custom_domain = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Non-sensitive runtime config — safe to commit.
# Sensitive values (API keys, JWTs) are stored as Worker Secrets.
[vars]
NEXT_PUBLIC_SUPABASE_URL    = "https://fqievqqzxrgvqrgknvas.supabase.co"
SUPABASE_PROJECT_REF        = "fqievqqzxrgvqrgknvas"
SUPABASE_FUNCTIONS_URL      = "https://fqievqqzxrgvqrgknvas.supabase.co/functions/v1"
NEXT_PUBLIC_VAPID_PUBLIC_KEY = "BFQjaP_QWa8fWGL-V9JffVfq8Gx4gfXZMCuB38tUVvuQQ2y03cwf_jWlo8EyMxEG32-GhdXlLs2K1KWkHH0hkKI"
VAPID_SUBJECT               = "mailto:swimmer571@gmail.com"
API_FOOTBALL_SEASON         = "2026"

# Cron triggers — fire every 2 minutes during live matches to sync scores.
# 720 API-Football calls/day (within the 7,500/day Pro plan limit).
# Reduced from 5min to stay responsive during 90-min matches while limiting
# cold-start pressure from cron-triggered Worker invocations.
[triggers]
crons = ["*/2 * * * *"]
